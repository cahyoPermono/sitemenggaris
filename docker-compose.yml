services:
  backend:
    build:
      context: ./backend/ExcelToXmlApi
      dockerfile: Dockerfile
    container_name: excel-to-xml-backend
    restart: unless-stopped
    ports:
      - "5050:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: excel-to-xml-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data:
