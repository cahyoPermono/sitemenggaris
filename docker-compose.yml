services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: excel-to-xml-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-Simenggaris2026!}
      - MSSQL_PID=${MSSQL_PID:-Developer}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-Simenggaris2026!}' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-Simenggaris2026!}' -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  backend:
    build:
      context: ./backend/ExcelToXmlApi
      dockerfile: Dockerfile
    container_name: excel-to-xml-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5050}:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${DB_NAME:-SitemenggarisDb};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Simenggaris2026!};TrustServerCertificate=True;MultipleActiveResultSets=true;Encrypt=False
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: excel-to-xml-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3050}:80"
    depends_on:
      - backend

volumes:
  sqlserver_data:
